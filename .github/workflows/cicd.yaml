on: 
  push: 
    branches: 
      - main

jobs: 
  build-and-push: 
    runs-on: ubuntu-latest

  permissions:
    contents: read
    packages: write

  steps:
    - name: Checkout code
      uses: actions/checkout@v6 

  
    - name: Security with GHCR
      uses: docker/login-action@v3
      with:
        registrly: ghcr.io
        username: ${{github.actor}} #my username?
        password: ${{secrets.GITHUB_TOKEN}} #no explicitly written password so security

    - name: push image to GHCR
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ghcr.io/<your-github-username>/echo-api:latest
  